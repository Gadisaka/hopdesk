# Builds the macOS .dmg and Windows installer.
# Push a version tag to publish a GitHub Release:  git tag v0.3.0 && git push --tags
# Or run it by hand from the Actions tab to just get the files as artifacts.
name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Optional: sign with the same "HopDesk Local" certificate as your Mac, so
      # macOS keeps Screen Recording and Accessibility after automatic updates.
      # Secrets: MACOS_LOCAL_CERT_P12 (base64 .p12) and MACOS_LOCAL_CERT_PASSWORD,
      # made by: bash scripts/make-signing-cert.sh --export
      - name: Import the HopDesk Local signing certificate
        env:
          P12: ${{ secrets.MACOS_LOCAL_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_LOCAL_CERT_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "No MACOS_LOCAL_CERT_P12 secret: the app will be ad-hoc signed."; exit 0; fi
          KC="$RUNNER_TEMP/build.keychain-db"; KCPASS="$(openssl rand -hex 16)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - name: Build HopDesk.app and .dmg
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          # Optional, for signed and notarized builds (Settings > Secrets):
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: dist/*.dmg

  windows:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build HopDesk Setup.exe
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: bash scripts/build-windows.sh
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: dist/*-Setup.exe

  release:
    if: github.ref_type == 'tag'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Signed latest.json lets installed copies update themselves.
      # Secret: HOPDESK_UPDATE_KEY, made by: go run ./cmd/releasetool keygen
      - name: Sign the update manifest
        env:
          HOPDESK_UPDATE_KEY: ${{ secrets.HOPDESK_UPDATE_KEY }}
        run: |
          if [ -z "$HOPDESK_UPDATE_KEY" ]; then
            echo "::warning::No HOPDESK_UPDATE_KEY secret, so this release won't be offered as an automatic update."
            exit 0
          fi
          go run ./cmd/releasetool sign -version "${{ github.ref_name }}" -dir dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
