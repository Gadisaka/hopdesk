# Builds the macOS .dmg and Windows installer.
# Push a version tag to publish a GitHub Release:  git tag v0.3.0 && git push --tags
# Or run it by hand from the Actions tab to just get the files as artifacts.
name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  macos:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build HopDesk.app and .dmg
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          # Optional, for signed and notarized builds (Settings > Secrets):
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  windows:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build HopDesk Setup.exe
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: bash scripts/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*-Setup.exe

  release:
    if: github.ref_type == 'tag'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
