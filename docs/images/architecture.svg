  <rect x="320" y="26" width="260" height="138" rx="14" fill="#111111" stroke="#2e2e2e" stroke-width="1.2"/>
  <g transform="translate(342,48)" fill="none" stroke="#ededed" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="0" width="24" height="9" rx="2"/><rect x="1" y="13" width="24" height="9" rx="2"/><path d="M6 4.5h.01M6 17.5h.01"/></g>
  <text x="380" y="62" font-size="11" font-weight="600" letter-spacing="1.2" fill="#707070">SERVER</text>
  <text x="342" y="102" font-size="20" font-weight="650" fill="#ededed" letter-spacing="-0.4">Meeting point</text>
  <text x="342" y="126" font-size="13" fill="#a1a1a1">Finds devices by name, serves the viewer.</text>
  <text x="342" y="146" font-size="13" fill="#a1a1a1">Never sees the screen or the password.</text>
  
  <rect x="28" y="206" width="268" height="138" rx="14" fill="#111111" stroke="#2e2e2e" stroke-width="1.2"/>
  <g transform="translate(50,228)" fill="none" stroke="#ededed" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="1" width="22" height="15" rx="2"/><path d="M0 20h26"/></g>
  <text x="88" y="242" font-size="11" font-weight="600" letter-spacing="1.2" fill="#707070">VIEWER</text>
  <text x="50" y="282" font-size="20" font-weight="650" fill="#ededed" letter-spacing="-0.4">Any browser</text>
  <text x="50" y="306" font-size="13" fill="#a1a1a1">Laptop, phone or tablet.</text>
  <text x="50" y="326" font-size="13" fill="#a1a1a1">Nothing to install.</text>
  
  <rect x="604" y="206" width="268" height="138" rx="14" fill="#111111" stroke="#ededed" stroke-width="1.6"/>
  <g transform="translate(626,228)" fill="none" stroke="#ededed" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="26" height="17" rx="2"/><path d="M8 22h10M13 17v5"/></g>
  <text x="664" y="242" font-size="11" font-weight="600" letter-spacing="1.2" fill="#707070">AGENT</text>
  <text x="626" y="282" font-size="20" font-weight="650" fill="#ededed" letter-spacing="-0.4">HopDesk app</text>
  <text x="626" y="306" font-size="13" fill="#a1a1a1">macOS or Windows.</text>
  <text x="626" y="326" font-size="13" fill="#a1a1a1">Screen, input, clipboard and files.</text>
  <path d="M250 204 C250 160 270 120 314 104" fill="none" stroke="#5a5a5a" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#d)"/>
  <path d="M650 204 C650 160 630 120 586 104" fill="none" stroke="#5a5a5a" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#d)"/>
  <text x="30" y="190" font-size="12.5" fill="#a1a1a1">① “connect me to studio-mac”</text>
  <text x="870" y="190" text-anchor="end" font-size="12.5" fill="#a1a1a1">① “I'm studio-mac”</text>
  <line x1="306" y1="262" x2="594" y2="262" stroke="#52a8ff" stroke-width="2.5" marker-start="url(#b)" marker-end="url(#b)"/>
  <text x="450" y="248" text-anchor="middle" font-size="13" font-weight="600" fill="#52a8ff">② WebRTC, end-to-end encrypted</text>
  <text x="450" y="290" text-anchor="middle" font-size="12.5" fill="#a1a1a1">H.264 video →   ← mouse and keyboard</text>
  <text x="450" y="310" text-anchor="middle" font-size="12.5" fill="#a1a1a1">clipboard ⇄   files ⇄   password proof</text>
  <text x="450" y="378" text-anchor="middle" font-size="12" fill="#707070">Direct, peer to peer, whenever possible. Through a TURN relay or Tailscale Funnel when not.</text>
