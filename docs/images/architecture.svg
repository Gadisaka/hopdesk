<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="880" height="380" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- server -->
  <rect x="320" y="30" width="240" height="96" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="440" y="62" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">hopdesk server</text>
  <text x="440" y="86" text-anchor="middle" font-size="13" fill="#475569">finds devices by ID · serves the viewer</text>
  <text x="440" y="106" text-anchor="middle" font-size="13" fill="#475569">no screen data passes through it</text>

  <!-- viewer -->
  <rect x="40" y="220" width="250" height="120" rx="12" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
  <text x="165" y="254" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Viewer</text>
  <text x="165" y="278" text-anchor="middle" font-size="13" fill="#475569">any web browser</text>
  <text x="165" y="300" text-anchor="middle" font-size="13" fill="#475569">laptop, desktop, tablet</text>
  <text x="165" y="322" text-anchor="middle" font-size="12" fill="#3b82f6">you are here</text>

  <!-- agent -->
  <rect x="590" y="220" width="250" height="120" rx="12" fill="#fff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="715" y="254" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Agent</text>
  <text x="715" y="278" text-anchor="middle" font-size="13" fill="#475569">the computer you control</text>
  <text x="715" y="300" text-anchor="middle" font-size="13" fill="#475569">macOS or Windows</text>
  <text x="715" y="322" text-anchor="middle" font-size="12" fill="#8b5cf6">screen · input · clipboard · files</text>

  <!-- signaling -->
  <path d="M190 216 L360 132" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#a)"/>
  <path d="M690 216 L520 132" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#a)"/>
  <text x="268" y="160" text-anchor="end" font-size="12.5" fill="#64748b">1. "connect me to mymac"</text>
  <text x="606" y="160" font-size="12.5" fill="#64748b">registered as "mymac"</text>

  <!-- p2p -->
  <path d="M298 272 L582 272" stroke="#7c3aed" stroke-width="3" fill="none" marker-start="url(#b)" marker-end="url(#b)"/>
  <text x="440" y="258" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7c3aed">2. WebRTC, encrypted end to end</text>
  <text x="440" y="296" text-anchor="middle" font-size="12.5" fill="#475569">H.264 video → · ← mouse, keys</text>
  <text x="440" y="316" text-anchor="middle" font-size="12.5" fill="#475569">clipboard ⇄ · files ⇄ · password check</text>
  <text x="440" y="364" text-anchor="middle" font-size="12" fill="#94a3b8">direct when possible, via a TURN relay or Tailscale when not</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
