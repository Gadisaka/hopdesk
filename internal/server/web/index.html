<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>hopdesk</title>
<link rel="stylesheet" href="ui.css">
<script src="theme.js"></script>
<style>
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  /* header */
  header {
    display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 16px 0 20px; flex: none;
    border-bottom: 1px solid var(--border); background: var(--bg);
  }
  .crumb { display: none; align-items: center; gap: 10px; min-width: 0; }
  header:has(#controls:not([hidden])) .crumb { display: inline-flex; }
  .crumb .device { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; min-width: 0; }
  .crumb .device b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px var(--green-bg); flex: none; }
  #liveStatus { color: var(--fg-subtle); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spacer { flex: 1; }
  #controls { display: flex; align-items: center; gap: 8px; }
  #controls .divider { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg-muted); cursor: pointer; white-space: nowrap; }

  /* stage */
  .wrap { flex: 1; display: flex; min-height: 0; }
  #surface {
    flex: 1; position: relative; display: flex; align-items: center; justify-content: center;
    overflow: hidden; outline: none; background: var(--stage);
  }
  #surface:has(#hint:not([hidden])) {
    background-image: radial-gradient(var(--dots) 1px, transparent 1px); background-size: 22px 22px;
  }
  #surface:focus-visible { box-shadow: inset 0 0 0 2px var(--ring); }
  #surface.drop { box-shadow: inset 0 0 0 2px var(--blue); background-color: var(--blue-bg); }
  #surface video, #surface canvas { width: 100%; height: 100%; object-fit: contain; display: block; }

  /* connect card */
  #hint { width: min(400px, calc(100% - 32px)); padding: 32px; }
  #hint .mark { width: 44px; height: 44px; margin-bottom: 20px; color: var(--fg); }
  #hint h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
  #hint .lede { margin: 6px 0 24px; color: var(--fg-muted); }
  #login { display: grid; gap: 14px; }
  #login input { width: 100%; }
  #connect { width: 100%; height: 40px; margin-top: 4px; }
  #status { min-height: 20px; margin-top: 12px; font-size: 13px; color: var(--fg-muted); text-align: center; }
  #status.err { color: var(--red); }
  #hintText { margin-top: 4px; font-size: 13px; color: var(--amber); text-align: center; }
  #hintText:empty { display: none; }
  .secure {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border);
    font-size: 12.5px; color: var(--fg-subtle);
  }
  .secure svg { width: 14px; height: 14px; }
  .newhere { display: block; margin-top: 10px; text-align: center; font-size: 13px; color: var(--fg-muted); text-decoration: none; }
  .newhere:hover { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }
  header .guide-link { margin-left: 4px; }

  /* files sheet */
  aside {
    width: 360px; flex: none; display: flex; flex-direction: column; min-height: 0;
    background: var(--bg); border-left: 1px solid var(--border);
  }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 12px 10px 20px; }
  .sheet-head h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .pathbar { display: flex; gap: 6px; align-items: center; padding: 0 16px 12px; }
  #path {
    flex: 1; min-width: 0; padding: 0 10px; height: 32px; line-height: 30px;
    border: 1px solid var(--border); border-radius: 6px; background: var(--bg-subtle);
    font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--fg-muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left;
  }
  #list { flex: 1; overflow: auto; border-top: 1px solid var(--border); padding: 6px; }
  #list .row {
    display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px;
    cursor: pointer; font-size: 13.5px;
  }
  #list .row:hover { background: var(--bg-hover); }
  #list .row svg { width: 16px; height: 16px; color: var(--fg-subtle); flex: none; }
  #list .row.dir svg { color: var(--blue); }
  #list .row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list .row .size { font-family: "Geist Mono", ui-monospace, Menlo, monospace; font-size: 12px; color: var(--fg-subtle); }
  #list .note { padding: 16px 10px; color: var(--fg-subtle); font-size: 13px; }
  .actions { padding: 12px 16px; border-top: 1px solid var(--border); display: grid; gap: 8px; }
  .actions button { width: 100%; }
  .actions .hint2 { text-align: center; font-size: 12px; color: var(--fg-subtle); }
  #transfers { max-height: 38%; overflow: auto; }
  #transfers:not(:empty) { border-top: 1px solid var(--border); }
  .xfer { padding: 10px 16px; display: grid; gap: 6px; }
  .xfer + .xfer { border-top: 1px solid var(--border); }
  .xfer .top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
  .xfer .top span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .xfer .pct { font-family: "Geist Mono", ui-monospace, Menlo, monospace; font-size: 12px; color: var(--fg-subtle); }
  .xfer progress { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border: 0; border-radius: 99px; background: var(--bg-muted); overflow: hidden; }
  .xfer progress::-webkit-progress-bar { background: var(--bg-muted); }
  .xfer progress::-webkit-progress-value { background: var(--accent); border-radius: 99px; }
  .xfer progress::-moz-progress-bar { background: var(--accent); }
  .xfer .msg { font-size: 12px; color: var(--fg-subtle); overflow-wrap: anywhere; }
  .xfer.err .msg, .xfer.err .pct { color: var(--red); }

  @media (max-width: 960px) {
    #controls .label-hide { display: none; }
    #liveStatus { display: none; }
  }
</style>
</head>
<body>
<header>
  <span class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="currentColor"/><g fill="none" style="stroke:var(--bg)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="11" y="21" width="24" height="17" rx="3"/><path d="M20 15c6-6 18-6 24 2M45 11l-1 7-6-2"/></g><rect x="31" y="31" width="22" height="15" rx="3" style="fill:var(--bg)"/></svg>
    HopDesk
  </span>
  <span class="crumb">
    <span class="crumb-sep">/</span>
    <span class="device"><span class="live-dot"></span><b id="crumbName"></b></span>
    <span id="liveStatus"></span>
  </span>
  <span class="spacer"></span>
  <div id="controls" hidden>
    <select id="display" class="sm" title="Display"></select>
    <select id="quality" class="sm" title="Quality">
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
      <option value="ultra">Ultra (native)</option>
    </select>
    <select id="fps" class="sm" title="Frames per second">
      <option value="5">5 fps</option><option value="10">10 fps</option><option value="15">15 fps</option>
      <option value="20">20 fps</option><option value="30">30 fps</option><option value="60">60 fps</option>
    </select>
    <label class="toggle" title="Send Ctrl when you press Cmd (for a Mac controlling a Windows PC)"><input id="swap" type="checkbox" class="switch"><span class="label-hide">Cmd → Ctrl</span></label>
    <span class="divider"></span>
    <button id="filesBtn" class="sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="label-hide">Files</span></button>
    <button id="disconnect" class="sm danger-ghost"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v8M6.3 6.8a8 8 0 1 0 11.4 0"/></svg><span class="label-hide">Disconnect</span></button>
    <span class="divider"></span>
  </div>
  <a id="helpLink" class="guide-link" href="help.html" target="_blank" rel="noopener" title="How HopDesk works"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 0 1 4.9.7c0 1.7-2.4 2.1-2.4 3.6M12 17h.01"/></svg><span class="label-hide">Guide</span></a>
  <div class="theme-switch" role="group" aria-label="Theme">
    <button data-theme-choice="system" title="System theme" aria-label="System theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
    <button data-theme-choice="light" title="Light theme" aria-label="Light theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <button data-theme-choice="dark" title="Dark theme" aria-label="Dark theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
  </div>
</header>

<div class="wrap">
  <div id="surface" tabindex="0">
    <video id="video" autoplay muted playsinline hidden></video>
    <canvas id="canvas" width="1280" height="720" hidden></canvas>
    <div id="hint" class="card">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="currentColor"/><g fill="none" style="stroke:var(--bg)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="11" y="21" width="24" height="17" rx="3"/><path d="M20 15c6-6 18-6 24 2M45 11l-1 7-6-2"/></g><rect x="31" y="31" width="22" height="15" rx="3" style="fill:var(--bg)"/></svg>
      <h1>Connect to a device</h1>
      <p class="lede">Enter the device name and password shown in HopDesk on that computer.</p>
      <div id="login">
        <label class="field">Device<input id="id" type="text" placeholder="studio-mac" autocomplete="off" spellcheck="false"></label>
        <label class="field">Password<input id="pw" type="password" placeholder="xxxx-xxxx-xxxx-xxxx" autocomplete="off"></label>
        <button id="connect" class="primary">Connect</button>
      </div>
      <div id="status" role="status">Not connected</div>
      <div id="hintText"></div>
      <div class="secure"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>End-to-end encrypted. Your password stays in this browser.</div>
      <a class="newhere" href="help.html" target="_blank" rel="noopener">New to HopDesk? Read the simple guide →</a>
    </div>
  </div>

  <aside id="files" hidden>
    <div class="sheet-head">
      <h3>Remote files</h3>
      <button id="filesClose" class="icon ghost" title="Close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="pathbar">
      <button id="up" class="icon sm" title="Up one folder" aria-label="Up one folder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      <button id="home" class="icon sm" title="Home folder" aria-label="Home folder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7M6 10v10h12V10"/></svg></button>
      <span id="path"></span>
    </div>
    <div id="list"></div>
    <div class="actions">
      <button id="uploadBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>Send files to this computer…</button>
      <input id="uploadInput" type="file" multiple hidden>
      <span class="hint2">or drop files anywhere on the screen</span>
    </div>
    <div id="transfers"></div>
  </aside>
</div>

<div id="modal" class="overlay" hidden><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="body"><h2 id="mTitle"></h2><p id="mText"></p><code id="mFp" class="fp"></code></div>
  <div class="btns"><button id="mCancel"></button><button id="mOk" class="primary"></button></div>
</div></div>
<div id="toast" class="toast" hidden><span id="toastText"></span><button id="toastBtn" class="sm" hidden></button></div>

<script src="ui.js"></script>
<script src="viewer.js"></script>
</body>
</html>
