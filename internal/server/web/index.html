<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hopdesk</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; font-size: 14px; }
  * { box-sizing: border-box; }
  body { margin: 0; display: flex; flex-direction: column; height: 100vh; background: #111; color: #eee; }
  header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: #1c1c1c; flex-wrap: wrap; border-bottom: 1px solid #2a2a2a; }
  input[type=text], input[type=password], select { padding: 6px 8px; border-radius: 6px; border: 1px solid #444; background: #222; color: #eee; font: inherit; }
  input[type=text], input[type=password] { width: 140px; }
  button { padding: 6px 12px; border-radius: 6px; border: 0; background: #3b82f6; color: white; cursor: pointer; font: inherit; }
  button.secondary { background: #3a3a3a; }
  button:disabled { opacity: .5; cursor: default; }
  label { color: #ccc; display: flex; gap: 4px; align-items: center; }
  .group { display: flex; gap: 8px; align-items: center; }
  #status { margin-left: auto; color: #aaa; }
  .wrap { flex: 1; display: flex; min-height: 0; }
  #surface { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; outline: none; position: relative; }
  #surface:focus-visible { box-shadow: inset 0 0 0 2px #3b82f6; }
  #surface.drop { box-shadow: inset 0 0 0 3px #22c55e; }
  #surface video, #surface canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
  #hint { position: absolute; pointer-events: none; text-align: center; color: #8a8a8a; }
  #hint svg { width: 72px; height: 72px; margin-bottom: 14px; }
  #hint .big { font-size: 22px; color: #e5e5e5; font-weight: 600; margin-bottom: 6px; }
  aside { width: 340px; background: #181818; border-left: 1px solid #2a2a2a; display: flex; flex-direction: column; min-height: 0; }
  aside h3 { margin: 0; padding: 10px 12px 6px; font-size: 13px; color: #aaa; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .pathbar { display: flex; gap: 6px; padding: 0 12px 8px; align-items: center; }
  #path { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #ccc; direction: rtl; text-align: left; }
  #list { flex: 1; overflow: auto; border-top: 1px solid #2a2a2a; }
  .row { display: flex; gap: 8px; padding: 6px 12px; cursor: pointer; align-items: center; }
  .row:hover { background: #242424; }
  .row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .size { color: #888; font-size: 12px; }
  .note { padding: 8px 12px; color: #888; }
  #transfers { border-top: 1px solid #2a2a2a; max-height: 35%; overflow: auto; }
  .xfer { padding: 6px 12px; border-bottom: 1px solid #222; }
  .xfer .top { display: flex; justify-content: space-between; gap: 8px; }
  .xfer .top span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .xfer progress { width: 100%; height: 6px; }
  .xfer .msg { color: #888; font-size: 12px; overflow-wrap: anywhere; }
  .xfer.err .msg { color: #f87171; }
  .actions { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid #2a2a2a; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #262626; border: 1px solid #3a3a3a; padding: 8px 12px; border-radius: 8px; display: flex; gap: 10px; align-items: center; box-shadow: 0 4px 16px rgba(0,0,0,.5); }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 10; }
  #modal .card { background: #1e1e1e; border: 1px solid #3a3a3a; border-radius: 12px; padding: 22px 24px; width: min(520px, 92vw); box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  #modal.danger .card { border-color: #dc2626; }
  #modal h2 { margin: 0 0 10px; font-size: 18px; }
  #modal.danger h2 { color: #f87171; }
  #modal p { color: #c8c8c8; line-height: 1.5; margin: 0 0 12px; white-space: pre-line; }
  #modal code { display: block; font: 600 17px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; background: #111; border: 1px solid #333; border-radius: 8px; padding: 10px 12px; margin: 0 0 16px; text-align: center; }
  #modal .btns { display: flex; gap: 8px; justify-content: flex-end; }
  button.danger { background: #dc2626; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <strong>hopdesk</strong>
  <div class="group" id="login">
    <input id="id" type="text" placeholder="Device ID" autocomplete="off">
    <input id="pw" type="password" placeholder="Password" autocomplete="off">
    <button id="connect">Connect</button>
  </div>
  <div class="group" id="controls" hidden>
    <select id="display" title="Display"></select>
    <select id="quality" title="Quality">
      <option value="low">Low quality</option>
      <option value="medium">Medium quality</option>
      <option value="high">High quality</option>
      <option value="ultra">Ultra (native)</option>
    </select>
    <select id="fps" title="Frames per second">
      <option value="5">5 fps</option><option value="10">10 fps</option><option value="15">15 fps</option>
      <option value="20">20 fps</option><option value="30">30 fps</option><option value="60">60 fps</option>
    </select>
    <label title="Send Ctrl when you press Cmd (for a Mac controlling a Windows PC)"><input id="swap" type="checkbox"> Cmd&rarr;Ctrl</label>
    <button id="filesBtn" class="secondary">Files</button>
    <button id="disconnect" class="secondary">Disconnect</button>
  </div>
  <span id="status">Not connected</span>
</header>
<div class="wrap">
  <div id="surface" tabindex="0">
    <video id="video" autoplay muted playsinline hidden></video>
    <canvas id="canvas" width="1280" height="720" hidden></canvas>
    <div id="hint">
      <svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
        <rect width="64" height="64" rx="15" fill="url(#hg)"/><rect x="11" y="20" width="24" height="17" rx="3" fill="none" stroke="#fff" stroke-width="3"/>
        <rect x="31" y="30" width="22" height="15" rx="3" fill="#fff"/><path d="M20 15c6-6 18-6 24 2" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M45 11l-1 7-6-2" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="big">Connect to one of your computers</div>
      <div id="hintText">Enter its device ID and password above.</div>
    </div>
  </div>
  <aside id="files" hidden>
    <h3>Remote files</h3>
    <div class="pathbar">
      <button id="up" class="secondary" title="Up one folder">&uarr;</button>
      <button id="home" class="secondary" title="Home folder">&#8962;</button>
      <span id="path"></span>
    </div>
    <div id="list"></div>
    <div class="actions">
      <button id="uploadBtn">Send files&hellip;</button>
      <input id="uploadInput" type="file" multiple hidden>
      <span class="note" style="padding:6px 0">or drop files on the screen</span>
    </div>
    <div id="transfers"></div>
  </aside>
</div>
<div id="modal" hidden><div class="card" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <h2 id="mTitle"></h2><p id="mText"></p><code id="mFp"></code>
  <div class="btns"><button id="mCancel" class="secondary"></button><button id="mOk"></button></div>
</div></div>
<div id="toast" hidden><span id="toastText"></span><button id="toastBtn" hidden></button></div>

<script src="viewer.js"></script>
</body>
</html>
